<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CameegDetect - Pure JS Tracker</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #video-container { position: relative; width: 100vw; height: 60vh; display: flex; justify-content: center; align-items: center; background: #111; flex-shrink: 0; }
        canvas { display: block; max-width: 100%; max-height: 100%; }
        #log-panel { flex-grow: 1; width: 100%; background: #000; overflow-y: scroll; font-size: 11px; padding: 10px; border-top: 2px solid #0f0; color: #0f0; box-sizing: border-box; }
        .err { color: #f00; font-weight: bold; }
        .warn { color: #ff0; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <div id="video-container">
        <canvas id="outputCanvas"></canvas>
    </div>
    <div id="log-panel">--- PURE JS INITIALIZING ---<br></div>

    <script>
        const logPanel = document.getElementById('log-panel');
        function log(msg, type) {
            const d = document.createElement('div');
            if (type === 'err') d.className = 'err';
            if (type === 'warn') d.className = 'warn';
            if (type === 'info') d.className = 'info';
            const time = new Date().toLocaleTimeString();
            d.innerText = "[" + time + "] > " + msg;
            logPanel.appendChild(d);
            logPanel.scrollTop = logPanel.scrollHeight;
        }
        
        // Override console to capture library logs
        const oldLog = console.log;
        const oldErr = console.error;
        console.log = function(...args) { log(args.join(' ')); oldLog.apply(console, args); };
        console.error = function(...args) { log(args.join(' '), 'err'); oldErr.apply(console, args); };
        window.onerror = function(msg, url, line) { log("CRASH: " + msg + " at " + line, 'err'); };

        log("Logger initialized.");

        const video = document.createElement('video');
        video.autoplay = true;
        video.playsinline = true;
        video.muted = true;
        
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Force front camera
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => {
                video.srcObject = stream;
                video.play();
                log("Camera access GRANTED.", "info");
                requestAnimationFrame(processVideo);
            })
            .catch(err => {
                log("Camera access DENIED: " + err.name + " - " + err.message, 'err');
            });
        } else {
            log("FATAL: WebRTC is not supported in this WebView!", 'err');
        }

        function processVideo() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Set canvas dimensions to match video
                if (canvas.width !== video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }
                
                // Draw the video frame to the canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Image processing: Get pixel data
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                let sumX = 0, sumY = 0, count = 0;
                const threshold = 60; // Luminance threshold for dark pupil

                // Loop through pixels (sample every 4th pixel for performance)
                for (let i = 0; i < data.length; i += 4 * 4) {
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;

                    if (lum < threshold) {
                        const pixelIndex = i / 4;
                        const x = pixelIndex % canvas.width;
                        const y = Math.floor(pixelIndex / canvas.width);
                        sumX += x;
                        sumY += y;
                        count++;
                    }
                }

                // If we found enough dark pixels, it's likely a pupil
                if (count > 20) {
                    const cx = sumX / count;
                    const cy = sumY / count;
                    const radius = Math.sqrt(count / Math.PI);

                    // Draw a green circle over the detected pupil
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#0f0';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    // Log occasionally to avoid spamming
                    if (Math.random() < 0.02) {
                        log(`Pupil Detected | Radius: ${radius.toFixed(2)}px`, 'info');
                    }
                }
            }
            requestAnimationFrame(processVideo);
        }
    </script>
</body>
</html>
